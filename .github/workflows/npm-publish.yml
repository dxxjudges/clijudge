name: npm Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        shell: bash
        run: |
          windres src/clijudge.rc -O coff -o clijudge_res.o
          g++ -std=c++17 -O2 -Wall -static -I include -o clijudge.exe src/main.cpp clijudge_res.o -lpsapi -luserenv -lole32 -lwinhttp

      - name: Smoke test
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\smoke_windows.ps1
          exit $LASTEXITCODE

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: npm-prebuild-windows
          path: clijudge.exe

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: |
          g++ -std=c++17 -O2 -Wall -I include -o clijudge src/main.cpp

      - name: Smoke test
        run: bash tests/smoke_linux.sh

      - name: Rename for package
        run: mv clijudge clijudge-linux.bin

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: npm-prebuild-linux
          path: clijudge-linux.bin

  build-linux-arm64:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: |
          g++ -std=c++17 -O2 -Wall -I include -o clijudge src/main.cpp

      - name: Smoke test
        run: bash tests/smoke_linux.sh

      - name: Rename for package
        run: mv clijudge clijudge-linux-arm64.bin

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: npm-prebuild-linux-arm64
          path: clijudge-linux-arm64.bin

  build-windows-arm64:
    runs-on: windows-11-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup llvm-mingw
        shell: bash
        run: |
          curl -L --retry 3 -o llvm-mingw.zip https://github.com/mstorsjo/llvm-mingw/releases/download/20260922/llvm-mingw-20260922-ucrt-aarch64.zip
          unzip -q llvm-mingw.zip || powershell.exe -Command "Expand-Archive -Force llvm-mingw.zip ."
          echo "$PWD/llvm-mingw-20260922-ucrt-aarch64/bin" >> "$GITHUB_PATH"

      - name: Build
        shell: bash
        run: |
          LLVM_BIN="$GITHUB_WORKSPACE/llvm-mingw-20260922-ucrt-aarch64/bin"
          if (cd src && "$LLVM_BIN/llvm-rc" "/fo$GITHUB_WORKSPACE/clijudge.res" clijudge.rc) \
             && "$LLVM_BIN/aarch64-w64-mingw32-clang++" -std=c++17 -O2 -Wall -static -I include -o clijudge.exe src/main.cpp clijudge.res -lpsapi -luserenv -lole32 -lwinhttp; then
            echo "manifest embedded via llvm-rc"
          else
            echo "::warning::llvm-rc resource embed failed; building without manifest"
            rm -f clijudge.exe
            "$LLVM_BIN/aarch64-w64-mingw32-clang++" -std=c++17 -O2 -Wall -static -I include -o clijudge.exe src/main.cpp -lpsapi -luserenv -lole32 -lwinhttp
          fi

      - name: Run and arch check
        shell: bash
        run: |
          "$PWD/llvm-mingw-20260922-ucrt-aarch64/bin/llvm-readobj" --file-headers clijudge.exe | grep -i "Machine:.*AA64"
          ./clijudge.exe help > /dev/null

      - name: Rename for package
        shell: bash
        run: mv clijudge.exe clijudge-windows-arm64.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: npm-prebuild-windows-arm64
          path: clijudge-windows-arm64.exe

  publish:
    needs: [build-windows, build-linux, build-windows-arm64, build-linux-arm64]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Windows binary
        uses: actions/download-artifact@v4
        with:
          name: npm-prebuild-windows
          path: prebuilds/windows

      - name: Download Linux binary
        uses: actions/download-artifact@v4
        with:
          name: npm-prebuild-linux
          path: prebuilds/linux

      - name: Download Windows ARM64 binary
        uses: actions/download-artifact@v4
        with:
          name: npm-prebuild-windows-arm64
          path: prebuilds/windows-arm64

      - name: Download Linux ARM64 binary
        uses: actions/download-artifact@v4
        with:
          name: npm-prebuild-linux-arm64
          path: prebuilds/linux-arm64

      - name: Arrange prebuilds
        run: |
          chmod +x prebuilds/linux/clijudge-linux.bin prebuilds/linux-arm64/clijudge-linux-arm64.bin
          ls -l prebuilds/windows prebuilds/linux prebuilds/windows-arm64 prebuilds/linux-arm64

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Validate package version against release tag
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${TAG#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) != release tag ($TAG_VERSION) - bump package.json in the build commit"
            exit 1
          fi

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::notice::NPM_TOKEN secret is not set - skipping npm publish"
            exit 0
          fi
          PKG_VERSION=$(node -p "require('./package.json').version")
          if npm view "clijudge@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "::notice::clijudge@$PKG_VERSION already on npm - skipping publish"
            exit 0
          fi
          npm publish --access public --provenance
