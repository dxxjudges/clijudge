name: Build and Release

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Build
        shell: bash
        run: |
          windres src/clijudge.rc -O coff -o clijudge_res.o
          g++ -std=c++17 -O2 -Wall -static -I include -o clijudge.exe src/main.cpp clijudge_res.o -lpsapi -luserenv -lole32 -lwinhttp
      
      - name: Smoke test
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\smoke_windows.ps1
          exit $LASTEXITCODE
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: clijudge-windows-${{ github.ref_name }}
          path: clijudge.exe

  build-linux:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Build
        run: |
          g++ -std=c++17 -O2 -Wall -I include -o clijudge src/main.cpp
      
      - name: Smoke test
        run: bash tests/smoke_linux.sh
      
      - name: Rename for release
        run: mv clijudge clijudge-linux.bin
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: clijudge-linux-${{ github.ref_name }}
          path: clijudge-linux.bin

  build-linux-arm64:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build
        run: |
          g++ -std=c++17 -O2 -Wall -I include -o clijudge src/main.cpp

      - name: Smoke test
        run: bash tests/smoke_linux.sh

      - name: Rename for release
        run: mv clijudge clijudge-linux-arm64.bin

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: clijudge-linux-arm64-${{ github.ref_name }}
          path: clijudge-linux-arm64.bin

  build-windows-arm64:
    runs-on: windows-11-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup llvm-mingw
        shell: bash
        run: |
          curl -L --retry 3 -o llvm-mingw.zip https://github.com/mstorsjo/llvm-mingw/releases/download/20260922/llvm-mingw-20260922-ucrt-aarch64.zip
          unzip -q llvm-mingw.zip || powershell.exe -Command "Expand-Archive -Force llvm-mingw.zip ."
          echo "$PWD/llvm-mingw-20260922-ucrt-aarch64/bin" >> "$GITHUB_PATH"

      - name: Build
        shell: bash
        run: |
          LLVM_BIN="$GITHUB_WORKSPACE/llvm-mingw-20260922-ucrt-aarch64/bin"
          if (cd src && "$LLVM_BIN/llvm-rc" /fo "$GITHUB_WORKSPACE/clijudge.res" clijudge.rc) \
             && "$LLVM_BIN/aarch64-w64-mingw32-clang++" -std=c++17 -O2 -Wall -static -I include -o clijudge.exe src/main.cpp clijudge.res -lpsapi -luserenv -lole32 -lwinhttp; then
            echo "manifest embedded via llvm-rc"
          else
            echo "::warning::llvm-rc resource embed failed; building without manifest"
            rm -f clijudge.exe
            "$LLVM_BIN/aarch64-w64-mingw32-clang++" -std=c++17 -O2 -Wall -static -I include -o clijudge.exe src/main.cpp -lpsapi -luserenv -lole32 -lwinhttp
          fi

      - name: Run and arch check
        shell: bash
        run: |
          "$PWD/llvm-mingw-20260922-ucrt-aarch64/bin/llvm-readobj" --file-headers clijudge.exe | grep -i "Machine:.*AA64"
          ./clijudge.exe help > /dev/null

      - name: Rename for release
        shell: bash
        run: mv clijudge.exe clijudge-windows-arm64.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: clijudge-windows-arm64-${{ github.ref_name }}
          path: clijudge-windows-arm64.exe

  release:
    needs: [build-windows, build-linux, build-windows-arm64, build-linux-arm64]
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Check commit message
        id: check
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$COMMIT_MSG" =~ ^build\ ([0-9]+\.[0-9]+\.[0-9]+) ]]; then
            echo "version=${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT
            echo "is_release=true" >> $GITHUB_OUTPUT
          else
            echo "is_release=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Get changelog
        if: steps.check.outputs.is_release == 'true'
        id: changelog
        run: |
          VERSION="${{ steps.check.outputs.version }}"
          
          # Find last release tag
          LAST_TAG=$(git tag -l "v*" --sort=-version:refname | head -n1)
          
          if [ -z "$LAST_TAG" ]; then
            # No previous release, get all commits
            CHANGELOG=$(git log --pretty=format:"- %s" HEAD)
          else
            # Get commits since last release
            CHANGELOG=$(git log --pretty=format:"- %s" "$LAST_TAG"..HEAD)
          fi
          
          # Write to file for multiline output
          echo "$CHANGELOG" > changelog.txt
          
          # Set output
          {
            echo "changelog<<EOF"
            cat changelog.txt
            echo "EOF"
          } >> $GITHUB_OUTPUT
      
      - name: Download artifacts
        if: steps.check.outputs.is_release == 'true'
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      
      - name: Create Release
        if: steps.check.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.check.outputs.version }}
          name: v${{ steps.check.outputs.version }}
          body: ${{ steps.changelog.outputs.changelog }}
          files: |
            dist/clijudge.exe
            dist/clijudge-linux.bin
            dist/clijudge-windows-arm64.exe
            dist/clijudge-linux-arm64.bin
          draft: false
          prerelease: false
