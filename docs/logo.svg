<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200" role="img" aria-label="CliJudge">
  <title>CliJudge</title>

  <defs>
    <!-- 背景：蓝紫渐变 -->
    <linearGradient id="bgBluePurple" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4F8CFF"/>
      <stop offset="0.5" stop-color="#7C5CFF"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
  </defs>

  <!-- 1:1 渐变圆角背景 -->
  <rect x="0" y="0" width="200" height="200" rx="44" fill="url(#bgBluePurple)"/>

  <!-- 前景符号：白色（按 1:1 画布居中缩放） -->
  <g fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"
     transform="translate(100 100) scale(0.9) translate(-90.4 -100.15)">
    <polyline points="7,49 77,87 7,125"/>
    <path d="M 173.8 116.7 A 40 40 0 1 1 173.8 57.3"/>
    <line x1="110.4" y1="153" x2="170.4" y2="153"/>
  </g>
</svg>
